<svg xmlns="http://www.w3.org/2000/svg" width="680" height="536" viewBox="0 0 680 536" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>ChatGuard prod 아키텍처</title>
<desc>3개 가용영역에 걸친 VPC 안에 퍼블릭·프라이빗·격리 서브넷 3계층이 있다. ALB가 프론트엔드와 채팅 서버로 경로를 분기하고, 채팅 서버와 AI 워커는 격리 서브넷의 RDS와 Redis에 접근한다. 아래는 GitOps 배포 파이프라인.</desc>
