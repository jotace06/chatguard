<svg xmlns="http://www.w3.org/2000/svg" width="680" height="272" viewBox="0 0 680 272" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>오토스케일의 두 축</title>
<desc>KEDA가 두 가지 신호로 서로 다른 컴포넌트를 확장한다. Prometheus의 WebSocket 접속 수는 채팅 서버를, Redis 검열 큐의 길이는 AI 워커를 움직인다.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect x="0" y="0" width="680" height="272" fill="#FFFFFF"/>

<rect x="40" y="40" width="200" height="64" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="140" y="62" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">WebSocket 접속 수</text>
<text x="140" y="84" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">Prometheus 메트릭</text>
<rect x="40" y="160" width="200" height="64" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="140" y="182" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">검열 큐 길이</text>
<text x="140" y="204" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">Redis mod:queue</text>

<rect x="296" y="40" width="88" height="184" rx="8" fill="#FAEEDA" stroke="#EF9F27" stroke-width="0.5"/>
<text x="340" y="124" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#633806">KEDA</text>

<rect x="440" y="40" width="200" height="64" rx="8" fill="#EEEDFE" stroke="#7F77DD" stroke-width="0.5"/>
<text x="540" y="62" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">Chat server</text>
<text x="540" y="84" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">파드당 100 연결 · min 3 / max 5</text>
<rect x="440" y="160" width="200" height="64" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
<text x="540" y="182" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">AI worker</text>
<text x="540" y="204" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">파드당 5건 · min 2 / max 10</text>

<line x1="242" y1="72" x2="292" y2="72" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="242" y1="192" x2="292" y2="192" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="386" y1="72" x2="436" y2="72" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="386" y1="192" x2="436" y2="192" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
