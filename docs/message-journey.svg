<svg xmlns="http://www.w3.org/2000/svg" width="680" height="580" viewBox="0 0 680 580" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>메시지 한 건의 처리 여정</title>
<desc>클라이언트가 보낸 메시지가 1차 키워드 검열에서 차단되거나, 통과하면 저장·큐 적재·전파를 거쳐 즉시 노출된다. 동시에 AI 워커가 비동기로 판정해 유해하면 DB 상태를 바꾸고 블러 이벤트를 전파한다.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect x="0" y="0" width="680" height="580" fill="#FFFFFF"/>

<rect x="40" y="40" width="180" height="44" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="130" y="62" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#2C2C2A">클라이언트가 전송</text>

<rect x="40" y="110" width="180" height="56" rx="8" fill="#EEEDFE" stroke="#7F77DD" stroke-width="0.5"/>
<text x="130" y="128" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">1차 키워드 검열</text>
<text x="130" y="149" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">동기 · 인메모리 캐시</text>

<rect x="280" y="110" width="240" height="56" rx="8" fill="#FCEBEB" stroke="#E24B4A" stroke-width="0.5"/>
<text x="400" y="128" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#791F1F">즉시 차단 · 여기서 끝</text>
<text x="400" y="149" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#A32D2D">발신자에게만 오류 회신</text>

<rect x="40" y="200" width="180" height="56" rx="8" fill="#EEEDFE" stroke="#7F77DD" stroke-width="0.5"/>
<text x="130" y="218" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">① MySQL 저장</text>
<text x="130" y="239" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">status = VISIBLE</text>
<rect x="250" y="200" width="180" height="56" rx="8" fill="#EEEDFE" stroke="#7F77DD" stroke-width="0.5"/>
<text x="340" y="218" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">② 검열 큐 적재</text>
<text x="340" y="239" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">실패하면 전파 중단</text>
<rect x="460" y="200" width="180" height="56" rx="8" fill="#EEEDFE" stroke="#7F77DD" stroke-width="0.5"/>
<text x="550" y="218" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">③ 방 채널 전파</text>
<text x="550" y="239" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">publish</text>

<rect x="460" y="300" width="180" height="56" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="550" y="318" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">전원에게 노출</text>
<text x="550" y="339" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">발신자 포함</text>

<rect x="250" y="300" width="180" height="56" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
<text x="340" y="318" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">④ AI 판정</text>
<text x="340" y="339" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">비동기 · 워커</text>

<rect x="250" y="400" width="180" height="56" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
<text x="340" y="418" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">⑤ BLURRED 기록</text>
<text x="340" y="439" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">DB를 먼저</text>
<rect x="460" y="400" width="180" height="56" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
<text x="550" y="418" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">⑥ hide 전파</text>
<text x="550" y="439" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">같은 방 채널로</text>

<rect x="460" y="500" width="180" height="56" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="550" y="518" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">전원 화면에서 블러</text>
<text x="550" y="539" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">사후 처리</text>

<line x1="130" y1="86" x2="130" y2="106" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="222" y1="138" x2="276" y2="138" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="249" y="126" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">금칙어</text>
<line x1="130" y1="168" x2="130" y2="196" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="140" y="182" dominant-baseline="central" font-size="12" fill="#5F5E5A">통과</text>
<line x1="222" y1="228" x2="246" y2="228" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="432" y1="228" x2="456" y2="228" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="550" y1="258" x2="550" y2="296" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="340" y1="258" x2="340" y2="296" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="340" y1="358" x2="340" y2="396" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="350" y="377" dominant-baseline="central" font-size="12" fill="#5F5E5A">유해</text>
<line x1="432" y1="428" x2="456" y2="428" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="550" y1="458" x2="550" y2="496" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
