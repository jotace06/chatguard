<svg xmlns="http://www.w3.org/2000/svg" width="680" height="466" viewBox="0 0 680 466" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Redis를 통한 파드 간 메시지 전파</title>
<desc>같은 방의 사용자 세 명이 서로 다른 채팅 서버 파드에 붙어 있고, 한 파드가 받은 메시지를 Redis 방 채널에 publish하면 구독 중인 모든 파드가 받아 각자의 클라이언트에 전달한다. 같은 Redis의 별도 리스트는 AI 워커의 작업 큐로 쓰인다.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect x="0" y="0" width="680" height="466" fill="#FFFFFF"/>

<rect x="60" y="40" width="140" height="40" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="130" y="60" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#2C2C2A">사용자 A</text>
<rect x="270" y="40" width="140" height="40" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="340" y="60" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#2C2C2A">사용자 B</text>
<rect x="480" y="40" width="140" height="40" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="550" y="60" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#2C2C2A">사용자 C</text>

<rect x="60" y="120" width="140" height="56" rx="8" fill="#EEEDFE" stroke="#7F77DD" stroke-width="0.5"/>
<text x="130" y="138" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">Chat server</text>
<text x="130" y="158" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">파드 1</text>
<rect x="375" y="120" width="140" height="56" rx="8" fill="#EEEDFE" stroke="#7F77DD" stroke-width="0.5"/>
<text x="445" y="138" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">Chat server</text>
<text x="445" y="158" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">파드 2</text>

<rect x="60" y="230" width="560" height="110" rx="12" fill="#FAECE7" stroke="#D85A30" stroke-width="0.5"/>
<text x="600" y="246" text-anchor="end" dominant-baseline="central" font-size="12" fill="#993C1D">ElastiCache Redis</text>
<rect x="90" y="264" width="240" height="56" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="210" y="282" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">room:{id} 채널</text>
<text x="210" y="303" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">pub/sub · 구독한 전 파드에 복사</text>
<rect x="360" y="264" width="240" height="56" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="480" y="282" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">mod:queue</text>
<text x="480" y="303" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">List · 한 작업을 한 워커만</text>

<rect x="360" y="380" width="240" height="56" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
<text x="480" y="398" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">AI moderation worker</text>
<text x="480" y="419" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">큐 깊이로 독립 스케일</text>

